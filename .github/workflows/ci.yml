name: CI

on:
  push:
  pull_request:

jobs:
  test-linux-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e . pytest ruff
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q tests/test_headless.py tests/test_linux_packaging.py
      - run: python -m network_manager.headless --help
      - run: node --check src/network_manager/web/app.js
      - run: bash -n apps/linux/install.sh

  build-rust-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # 桌面端只面向 Windows（依赖 windows crate / tao / wry），所以放 windows-latest。
      # 用 check 而不是 build：链接这一步很慢，而这里要挡的是「编译不过照样 merge」，
      # 类型检查和 clippy 已经够；产物由本地发版流程出。
      - run: cargo check --release --manifest-path rust/Cargo.toml
      # 只做静态检查，警告不阻断（历史代码有一批 clippy 警告，一次性修不完）。
      - run: cargo clippy --release --manifest-path rust/Cargo.toml

  # Rust 在 Linux 上的产物：一条常驻服务（systemd 管着），管理页面用浏览器打开。
  # 原生界面（tao + wry）只在 Windows 上编，所以这里不需要 WebKit/GTK 的开发包，
  # 编出来的是一个没有图形栈依赖的静态小二进制。
  build-rust-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo build --release --manifest-path rust/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: network-manager-linux-x86_64
          path: rust/target/release/network-manager-rs
      # 冒烟：参数解析正常，且能以服务方式起起来（timeout 到点送 SIGTERM，
      # 正好验证 systemd stop 用的那条退出路径）。
      - run: |
          ./rust/target/release/network-manager-rs --help
          NETWORK_MANAGER_WEB_PORT=19091 timeout --preserve-status 10 \
            ./rust/target/release/network-manager-rs --headless || true

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/download_mihomo.py
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q
      - run: node --check src/network_manager/web/app.js
