[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "network-manager"
version = "0.6.10"
description = "Cross-platform TUN routing manager with a Windows desktop app and Linux headless WebGUI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "psutil>=6.0",
  "requests[socks]>=2.32",
]

# 桌面端（Windows 的 NetworkManager.exe）已经是 Rust 实现的，这里只留 Linux 侧的
# headless WebGUI 和部署工具链，PySide6 / PyInstaller 那一整套随之去掉。
[project.optional-dependencies]
dev = [
  "paramiko>=4.0",
  "pytest>=8.0",
  "ruff>=0.8",
  "playwright>=1.49",
  "build>=1.2",
  "pillow>=10.0",
]

[project.scripts]
network-manager-headless = "network_manager.headless:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
network_manager = [
  "web/*.html",
  "web/*.css",
  "web/*.js",
  "web/icons/*.svg",
  "web/icons/*.ico",
  "web/icons/LUCIDE_LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
