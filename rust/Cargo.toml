[package]
name = "network-manager-rs"
version = "0.6.11"
edition = "2021"
description = "Rust rewrite of the Network Manager control backend"
build = "build.rs"

[[bin]]
name = "network-manager-rs"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "socks",
    "gzip",
] }
base64 = "0.22"
sysinfo = "0.31"
dirs = "5"
rand = "0.8"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
data-encoding = "2"
percent-encoding = "2"
# Minimal SSH-2 client (no external ssh.exe / SSH_ASKPASS dependency).
ring = "0.17"
aes = "0.8"
sha2 = "0.10"
hmac = "0.12"
num-bigint-dig = "0.8"

# 原生界面只给 Windows：Linux 上的形态是服务器（systemd 常驻 + 浏览器访问
# 管理页），把 GTK/WebKit 整套图形栈编进来既用不上，也会让发布包和构建环境
# 平白变重（要 libwebkit2gtk-4.1-dev 才能编过）。Linux 走 --headless 常驻服务。
[target.'cfg(target_os = "windows")'.dependencies]
tao = { version = "0.35", features = ["rwh_06"] }
wry = "0.55"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_UI_Shell",
    "Win32_UI_Controls_Dialogs",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
# 把应用图标嵌进 exe（Windows 资源），与 Python 版 spec 里的 icon= 保持一致。
embed-resource = "3.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# 不用 panic = "abort"：abort 会让任何一次恐慌直接杀死进程，既来不及摘掉托盘图标
# （留下点了没反应的死图标），也没法记下崩溃现场。改成 unwind 后，界面事件循环里
# 的恐慌可以被 catch_unwind 收住，程序能收拾干净再退出。
panic = "unwind"
strip = true
