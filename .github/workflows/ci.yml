name: CI

on:
  push:
  pull_request:

jobs:
  test-linux-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e . pytest ruff
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q tests/test_headless.py tests/test_linux_packaging.py
      - run: python -m network_manager.headless --help
      - run: node --check src/network_manager/web/app.js
      - run: bash -n apps/linux/install.sh

  build-rust-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # 桌面端只面向 Windows（依赖 windows crate / tao / wry），所以放 windows-latest。
      # 用 check 而不是 build：链接这一步很慢，而这里要挡的是「编译不过照样 merge」，
      # 类型检查和 clippy 已经够；产物由本地发版流程出。
      - run: cargo check --release --manifest-path rust/Cargo.toml
      # 只做静态检查，警告不阻断（历史代码有一批 clippy 警告，一次性修不完）。
      - run: cargo clippy --release --manifest-path rust/Cargo.toml

  # 目标是把 Python 那套全换成 Rust，前提是 Rust 也能在 Linux 上跑（现在 Linux
  # 侧还是 Python 的 headless 在顶着）。这里先验证它能不能编译过。
  build-rust-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # wry 要 WebKitGTK，编译期就需要头文件；headless 模式运行时用不到界面，
      # 但只要 Cargo.toml 里挂着 wry，编译就得有它。
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
      - run: cargo check --release --manifest-path rust/Cargo.toml

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/download_mihomo.py
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q
      - run: node --check src/network_manager/web/app.js
