name: CI

on:
  push:
  pull_request:

jobs:
  # 仓库里的发布/安装脚本是 bash + PowerShell，前端是 JS，产品代码全是 Rust，
  # 所以这里只做静态校验：shell 语法、PowerShell 语法、前端 JS 语法。
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash -n apps/linux/install.sh
      - run: bash -n scripts/build_linux_release.sh
      # 打包脚本要能正常启动（版本号从 rust/Cargo.toml 读）。
      - run: bash scripts/build_linux_release.sh --help
      - run: node --check src/network_manager/web/app.js

  build-rust-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # 桌面端只面向 Windows（依赖 windows crate / tao / wry），所以放 windows-latest。
      # 用 check 而不是 build：链接这一步很慢，而这里要挡的是「编译不过照样 merge」，
      # 类型检查和 clippy 已经够；产物由本地发版流程出。
      - run: cargo check --release --manifest-path rust/Cargo.toml
      # 只做静态检查，警告不阻断（历史代码有一批 clippy 警告，一次性修不完）。
      - run: cargo clippy --release --manifest-path rust/Cargo.toml
      # 打包脚本用解析器做语法检查（不执行）：它平时不跑，坏了要等发版才发现。
      - run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/build_windows_installer.ps1"),
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host "ERROR: $_" }; exit 1 }
          Write-Host "PowerShell syntax OK"
        shell: pwsh

  # Rust 在 Linux 上的产物：一条常驻服务（systemd 管着），管理页面用浏览器打开。
  # 原生界面（tao + wry）只在 Windows 上编，所以这里不需要 WebKit/GTK 的开发包，
  # 编出来的是一个没有图形栈依赖的静态小二进制。
  build-rust-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo build --release --manifest-path rust/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: network-manager-linux-x86_64
          path: rust/target/release/network-manager-rs
      # 冒烟：参数解析正常，能起服务并回答一次 HTTP，且收到 SIGTERM 能干净退出
      # （systemd stop 走的就是这条路径）。
      - run: |
          ./rust/target/release/network-manager-rs --help
          NETWORK_MANAGER_WEB_PORT=19091 NETWORK_MANAGER_DATA_DIR=/tmp/nm-smoke \
            ./rust/target/release/network-manager-rs &
          pid=$!
          for _ in $(seq 1 30); do
            if curl -sf -o /tmp/nm-smoke.html http://127.0.0.1:19091/; then break; fi
            sleep 1
          done
          grep -q "Network Manager" /tmp/nm-smoke.html
          # 严格判定：收到 SIGTERM 后应当正常收尾退出（0）。崩溃或被信号打死会非 0。
          kill -TERM "${pid}"
          wait "${pid}"
      # 顺手把可直接安装的发布包打出来：Windows 上交叉编不出 Linux 二进制，
      # 所以 Linux 的发布包只能由这里的 runner 出。
      - run: bash scripts/build_linux_release.sh --output release --arch amd64 --binary rust/target/release/network-manager-rs
      - uses: actions/upload-artifact@v4
        with:
          name: NetworkManager-Linux-amd64
          path: release/NetworkManager-Linux-amd64-*.tar.gz
      # 安装脚本 / systemd 单元的契约（原先是 Python 测试，已随 Python 一起换成 Rust）。
      - run: cargo test --manifest-path rust/Cargo.toml --test linux_packaging
