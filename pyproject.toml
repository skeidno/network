[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "network-manager"
version = "0.2.0"
description = "Windows-first TUN routing manager with subscriptions, traffic monitoring, and SSH proxy tunnels."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.10.3,<6.11",
  "PyYAML>=6.0",
  "psutil>=6.0",
  "requests[socks]>=2.32",
  "paramiko>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "pyinstaller>=6.0",
  "playwright>=1.49",
  "build>=1.2",
  "pillow>=10.0",
]

[project.scripts]
network-manager = "network_manager.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
network_manager = [
  "style.qss",
  "web/*.html",
  "web/*.css",
  "web/*.js",
  "web/icons/*.svg",
  "web/icons/*.ico",
  "web/icons/LUCIDE_LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
